name: Build and run
on:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches: [ main, 'feat/**' ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main, 'feat/**' ]
    paths-ignore:
      - '**.md'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed if using OIDC to get release secrets.

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Build console app
        run: dotnet build DotNetConsoleApp

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build MAUI app (Android)
        run: dotnet build MauiApp/MauiApp.csproj -f net8.0-android -p:TargetFrameworks=net8.0-android

      - uses: launchdarkly/gh-actions/actions/verify-hello-app@485c862dcc1d6a1357892727d47994962b205e22 # verify-hello-app-v2.0.1
        with:
          use_mobile_key: true
          role_arn: ${{ vars.AWS_ROLE_ARN }}
          command: dotnet run --project DotNetConsoleApp

  build-maui-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: Build MAUI app (iOS)
        run: dotnet build MauiApp/MauiApp.csproj -f net8.0-ios -p:TargetFrameworks=net8.0-ios
